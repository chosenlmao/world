<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide</title>
    <!-- Colyseus Browser SDK -->
    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85)), 
                        url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .game-logo {
            width: 880px;
            max-width: 92vw;
            height: auto;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .tab.active {
            background: #38bdf8;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button.primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        button.primary-btn:hover {
            background: #7dd3fc;
        }

        .message {
            margin-top: 14px;
            text-align: center;
            font-size: 0.85rem;
            min-height: 20px;
        }

        .error { color: #f87171; }
        .success { color: #4ade80; }

        /* Lobby / Game View */
        #game-view {
            display: none;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- LARGE GAME LOGO -->
    <div class="logo-container">
        <img src="logo.png" alt="Worlds Collide" class="game-logo">
    </div>

    <!-- START MENU & ACCOUNT CREATOR -->
    <div class="card" id="auth-view">
        <p class="subtitle">Sign in or create an account to play</p>

        <div class="tabs">
            <button type="button" class="tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
            <button type="button" class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required minlength="3">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required minlength="4">
            </div>

            <div class="form-group" id="confirm-group" style="display: none;">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password">
            </div>

            <button type="submit" class="primary-btn" id="submit-btn">Log In & Play</button>
            <div class="message" id="message"></div>
        </form>
    </div>

    <!-- CONNECTED VIEW -->
    <div class="card" id="game-view">
        <p class="subtitle" id="welcome-text">Welcome!</p>
        <div class="status-badge" id="connection-status">Connecting to server...</div>
        
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">
            You are now in the lobby. Ready to play!
        </p>

        <button type="button" class="primary-btn" style="background: #334155; color: #f8fafc;" onclick="logout()">Log Out</button>
    </div>

    <script>
        let mode = 'login';
        let room = null;
        const client = new Colyseus.Client("wss://worlds-collide.onrender.com");

        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('message').textContent = '';
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('confirm-group').style.display = mode === 'signup' ? 'block' : 'none';
            document.getElementById('submit-btn').textContent = mode === 'login' ? 'Log In & Play' : 'Create Account & Play';
        }

        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document
